scenario:
  type: personal_code_update
  mode: update
  name: "Personal Code Loading"
  description: "Personal code to be added to exinsting RiderProfile table. This scenario does not generate any tour-specific data."

aws:
  stack_name: dev
  # region: ap-south-1  # Uncomment to override AWS config default  


target:
  table_name: RiderProfile
  attribute_name: personalCode

selection:
  filter:
    type: attribute_not_exists
    attribute: personalCode
  # Limit the eligible pool expectation to the number of codes provided.
  limit:
    type: reference_count
    source: personal_codes

