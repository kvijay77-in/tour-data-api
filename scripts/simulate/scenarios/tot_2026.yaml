# =============================================================================
# Test Data Scenario Configuration
# =============================================================================
# This template defines the tour-specific data to simulate for testing.
# Rider profiles and tour master data are read from existing DynamoDB tables.
# Only tour-specific data (TourRider, Ride, CheckIn) is generated.
#
# Usage:
#   python scripts/simulate/generate_data.py --scenario scripts/simulate/scenarios/tot_2026.yaml
#   python scripts/simulate/generate_data.py --scenario scripts/simulate/scenarios/tot_2026.yaml --dry-run
# =============================================================================

scenario:
  type: tour_data_generation
  mode: create
  name: "TOT-2026 Full Tour Simulation"
  description: "7-day tour with 70 riders, days 1-3 completed, day 4 active"

# AWS environment configuration
aws:
  stack_name: dev
  # region: ap-south-1  # Uncomment to override AWS config default

# Tour reference (must already exist in TourMaster table)
tour:
  tour_id: TOT-2026
  self_quit_riding_allowed: false
  # Status to set on TourMaster after data generation (optional)
  target_status: ACTIVE

# Tour rider registration (written to TourRider-{tourId} table)
# Riders are selected from existing profiles in the RiderProfile table
tour_riders:
  count: 90          # Number of riders to register for this tour
  selection:
    filter:
      # Only select riders with a personal code (personalCode attribute exists)
      type: attribute_exists
      attribute: personalCode

# Ride schedule and check-in distributions
rides:
  # Dynamic date generation:
  # - anchor_ride_number is treated as today's ride
  # - Each day's date is derived relative to that anchor
  date_strategy:
    mode: ride_number_anchor
    anchor_ride_number: 4
    anchor_date: today

  # Default stage layout for all rides (override per-day with 'stages' key)
  # Stage types: START, PIT_STOP, FINISH
  # default_stage_count includes START and FINISH.
  # Example: 4 -> START + 2 PIT_STOP + FINISH.
  default_stage_count: 4
  default_stages:
    - { type: START, name: Start, self_check_in_allowed: true, self_not_riding_allowed: false }
    - { type: PIT_STOP, name: PS1, estimated_open_time: 90, pit_stop_duration: 45, self_check_in_allowed: false }
    - { type: PIT_STOP, name: PS2, estimated_open_time: 210, pit_stop_duration: 60, self_check_in_allowed: false }
    - { type: PIT_STOP, name: PS3, estimated_open_time: 300, pit_stop_duration: 60, self_check_in_allowed: false }
    - { type: FINISH, name: Finish, self_check_in_allowed: true }
  self_check_in_allowed: true

  schedule:
    # -------------------------------------------------------------------------
    # Day 1 - COMPLETED
    # -------------------------------------------------------------------------
    - day: 1
      name: "Day 1"
      pit_stop_distances_from_start:
        PS1: 22
        PS2: 52
      start_location: "Chennai"
      finish_location: "Mahabalipuram"
      distance: 80
      flag_off_time: "08:00"
      rides_count: 1
      checkins:
        not_riding: 0
        quit:
          - { after_stage: Start, count: 0 }
          - { after_stage: PS1, count: 0 }
          - { after_stage: PS2, count: 0 }
        finished: all_remaining

    # -------------------------------------------------------------------------
    # Day 2 - COMPLETED
    # -------------------------------------------------------------------------
    - day: 2
      name: "Day 2"
      stage_count: 5
      # Per-ride pit-stop distance from start (km).
      # Keys can be pit-stop names (PS1/PS2/...) or order (1..N).
      pit_stop_distances_from_start:
        PS1: 28
        PS2: 62
        PS3: 92
      start_location: "Mahabalipuram"
      finish_location: "Pondicherry"
      distance: 110
      flag_off_time: "08:00"
      rides_count: 1
      checkins:
        not_riding: 5
        quit:
          - { after_stage: Start, count: 0 }
          - { after_stage: PS1, count: 1 }
          - { after_stage: PS2, count: 7 }
        finished: all_remaining

    # -------------------------------------------------------------------------
    # Day 3 - COMPLETED
    # -------------------------------------------------------------------------
    - day: 3
      name: "Day 3"
      pit_stop_distances_from_start:
        PS1: 30
        PS2: 72
      start_location: "Pondicherry"
      finish_location: "Chidambaram"
      distance: 120
      flag_off_time: "08:00"
      rides_count: 1
      rider_exit: 1
      checkins:
        not_riding: 4
        quit:
          - { after_stage: Start, count: 1 }
          - { after_stage: PS1, count: 2 }
          - { after_stage: PS2, count: 5 }
        finished: all_remaining

    # -------------------------------------------------------------------------
    # Day 4 - ACTIVE (in progress)
    # -------------------------------------------------------------------------
    - day: 4
      name: "Day 4"
      self_quit_riding_allowed: true
      pit_stop_distances_from_start:
        PS1: 29
        PS2: 69
      start_location: "Chidambaram"
      finish_location: "Thanjavur"
      distance: 120
      flag_off_time: "08:00"
      rides_count: 1
      floats:
        - float: 1
          float_to_stage: 2
      rider_exit: 1
      checkins:
        not_riding: 4
        quit:
          - { after_stage: Start, count: 1 }
          - { after_stage: PS1, count: 4 }
          - { after_stage: PS2, count: 5 }
        finished: 10
        # In-progress riders: checked in up to and including the named stage
        # Distribution: more toward later stages, fewer at earlier stages
        in_progress:
          PS2: 27
          PS1: 17
          Start: 2

    - day: 5
      name: "Day 5"
      stage_count: 5
      pit_stop_distances_from_start:
        PS1: 20
        PS2: 42
        PS3: 60
      start_location: "Thanjavur"
      finish_location: "Trichy"
      distance: 75
      flag_off_time: "09:00"
      rides_count: 1
      floats:
        - float: 1
          float_to_stage: 1
        - float: 2
          float_to_stage: 2

    # Day 6 has 2 rides
    - day: 6
      name: "Day 6"
      rides:
        - name: "Day 6 Ride 1"
          pit_stop_distances_from_start:
            PS1: 35
            PS2: 85
          start_location: "Trichy"
          finish_location: "Madurai"
          distance: 130
          flag_off_time: "07:30"
        - name: "Day 6 Ride 2"
          pit_stop_distances_from_start:
            PS1: 35
            PS2: 85
          start_location: "Trichy"
          finish_location: "Madurai"
          distance: 130
          flag_off_time: "12:30"

    - day: 7
      name: "Day 7"
      pit_stop_distances_from_start:
        PS1: 45
        PS2: 105
      start_location: "Madurai"
      finish_location: "Kanyakumari"
      distance: 160
      flag_off_time: "08:00"
      rides_count: 1

# Script behaviour options
options:
  clean_before_load: true    # Delete existing data from tour tables before loading
  update_tour_status: true   # Update TourMaster status to tour.target_status
  seed: 42                   # Random seed for reproducible data generation
