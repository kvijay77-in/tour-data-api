version = 0.1

[default]
[default.global.parameters]
stack_name = "dev"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
tags = "Project=\"tour-data-api\" Environment=\"dev\""
# Cognito User Pool is auto-created by default. No need to provide CognitoUserPoolArn/CognitoAppClientId
# unless you want to use an existing User Pool.
# parameter_overrides = "Environment=dev"
parameter_overrides = "Environment=dev"
# scripts/deploy_backend.py resolves ManagementWebAllowedOrigins and merges it
# with these overrides before every Make or CI deployment.

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"

# Test environment configuration
[test]
[test.global.parameters]
stack_name = "test"

[test.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
# Cognito User Pool is auto-created by default.
# parameter_overrides = "Environment=test"
parameter_overrides = "Environment=test"
# Test remains no-web unless MANAGEMENT_WEB_ENABLED is explicitly enabled.

# Production environment configuration
[prod]
[prod.global.parameters]
stack_name = "prod"

[prod.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
# Cognito User Pool is auto-created by default.
# parameter_overrides = "Environment=prod"
parameter_overrides = "Environment=prod"
