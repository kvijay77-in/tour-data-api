AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  tour-data-api
  
  Backend API for cycling tour management providing centralized data access
  for Check-In App and future applications.
  
  Table Strategy: Hybrid (Shared + Tour-Specific)
  - Shared tables (SAM-managed): RiderProfile, TourMaster
  - Tour-specific tables (runtime-provisioned): TourRider-{tourId}, Ride-{tourId},
    CheckIn-{tourId}, User-{tourId}, Notification-{tourId}

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W8001  # CreateCognito condition references conditional resources

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: !Ref PythonRuntime
    Architectures:
      - x86_64
    Environment:
      Variables:
        # Shared table names (SAM-managed)
        RIDER_PROFILE_TABLE: !Ref RiderProfileTable
        TOUR_MASTER_TABLE: !Ref TourMasterTable
        # Dynamic table name resolution
        STACK_NAME: !Ref AWS::StackName
        # Metadata
        SUBSCRIPTION_ID: !Ref SubscriptionId
        ENVIRONMENT: !Ref Environment
        PHOTOS_BUCKET: !Ref PhotosBucket
        MGMT_USER_POOL_ID: !If
          - CreateCognito
          - !Ref CognitoUserPool
          - !Select [1, !Split ['/', !Select [5, !Split [':', !Ref CognitoUserPoolArn]]]]
        LOG_LEVEL: INFO
    Tags:
      Project: tour-data-api
      Environment: !Ref Environment
      Application: TourManagement
      ManagedBy: SAM
      SubscriptionId: !Ref SubscriptionId

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Environment name (dev, test, or prod)

  PythonRuntime:
    Type: String
    Default: python3.14
    AllowedValues:
      - python3.11
      - python3.12
      - python3.13
      - python3.14
    Description: Python runtime version for Lambda functions
  
  CognitoUserPoolArn:
    Type: String
    Description: ARN of an existing Cognito User Pool. Leave empty to auto-create one.
    Default: ''
  
  CognitoAppClientId:
    Type: String
    Description: Existing Cognito App Client ID. Leave empty to auto-create one.
    Default: ''
  
  SubscriptionId:
    Type: String
    Description: Unique identifier for this deployment instance (for tracking and cost attribution)
    Default: ''
  


Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  CreateCognito: !Equals [!Ref CognitoUserPoolArn, '']


Resources:
  # ============================================================================
  # COGNITO USER POOL (auto-created when CognitoUserPoolArn is not provided)
  # ============================================================================

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Condition: CreateCognito
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-mgmt-users'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
      UserPoolTags:
        Project: tour-data-api
        Environment: !Ref Environment
        ManagedBy: SAM

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: CreateCognito
    Properties:
      ClientName: !Sub '${AWS::StackName}-app-client'
      UserPoolId: !Ref CognitoUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false

  # ============================================================================
  # COGNITO USER POOL GROUPS (RBAC)
  # Mirrors the UserRole enum in models.py.  Groups are only created when the
  # User Pool is auto-created (CreateCognito condition is true).
  # When an existing pool is supplied via CognitoUserPoolArn the groups must
  # be managed outside this template.
  # ============================================================================

  CognitoGroupAdministrator:
    Type: AWS::Cognito::UserPoolGroup
    Condition: CreateCognito
    Properties:
      GroupName: ADMINISTRATOR
      Description: >
        Full administrative access: create/archive tours, manage rides,
        all check-ins (including manual), view all data.
      UserPoolId: !Ref CognitoUserPool

  CognitoGroupSuperUser:
    Type: AWS::Cognito::UserPoolGroup
    Condition: CreateCognito
    Properties:
      GroupName: SUPER_USER
      Description: >
        Elevated access: all check-ins (including manual),
        view all data except user management.
      UserPoolId: !Ref CognitoUserPool

  CognitoGroupPitStop1User:
    Type: AWS::Cognito::UserPoolGroup
    Condition: CreateCognito
    Properties:
      GroupName: PS_1_USER
      Description: >
        Pit stop stage 1 access: regular PIT_STOP check-ins for stage 1,
        plus Quit Riding check-ins and read operations.
      UserPoolId: !Ref CognitoUserPool

  CognitoGroupPitStop2User:
    Type: AWS::Cognito::UserPoolGroup
    Condition: CreateCognito
    Properties:
      GroupName: PS_2_USER
      Description: >
        Pit stop stage 2 access: regular PIT_STOP check-ins for stage 2,
        plus Quit Riding check-ins and read operations.
      UserPoolId: !Ref CognitoUserPool

  CognitoGroupPitStop3User:
    Type: AWS::Cognito::UserPoolGroup
    Condition: CreateCognito
    Properties:
      GroupName: PS_3_USER
      Description: >
        Pit stop stage 3 access: regular PIT_STOP check-ins for stage 3,
        plus Quit Riding check-ins and read operations.
      UserPoolId: !Ref CognitoUserPool

  CognitoGroupPitStop4User:
    Type: AWS::Cognito::UserPoolGroup
    Condition: CreateCognito
    Properties:
      GroupName: PS_4_USER
      Description: >
        Pit stop stage 4 access: regular PIT_STOP check-ins for stage 4,
        plus Quit Riding check-ins and read operations.
      UserPoolId: !Ref CognitoUserPool

  CognitoGroupPitStop5User:
    Type: AWS::Cognito::UserPoolGroup
    Condition: CreateCognito
    Properties:
      GroupName: PS_5_USER
      Description: >
        Pit stop stage 5 access: regular PIT_STOP check-ins for stage 5,
        plus Quit Riding check-ins and read operations.
      UserPoolId: !Ref CognitoUserPool

  CognitoGroupHotelStaff:
    Type: AWS::Cognito::UserPoolGroup
    Condition: CreateCognito
    Properties:
      GroupName: HOTEL_STAFF
      Description: >
        Limited operational access: QR-scan check-ins and read operations.
        Cannot view dashboard or perform admin actions.
      UserPoolId: !Ref CognitoUserPool

  CognitoGroupGuest:
    Type: AWS::Cognito::UserPoolGroup
    Condition: CreateCognito
    Properties:
      GroupName: GUEST
      Description: >
        Read-only access: view tours, riders, and ride data.
        Cannot create check-ins or perform any write operations.
      UserPoolId: !Ref CognitoUserPool

  # ============================================================================
  # COGNITO USER POOL - RIDER APP (dedicated, separate from tour-mgmt-app pool)
  # Provides proper isolation between management and rider user bases.
  # A person can be both a rider and a tour organizer with separate identities.
  # ============================================================================

  CognitoRiderUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-rider-users'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
      UserPoolTags:
        Project: tour-data-api
        Environment: !Ref Environment
        Application: TourRiderApp
        ManagedBy: SAM

  CognitoRiderUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AWS::StackName}-rider-app-client'
      UserPoolId: !Ref CognitoRiderUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false

  CognitoRiderGroupRider:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: RIDER
      Description: >
        Rider self-service access: manage own profile, register for tours,
        view ride info, notifications, and personal statistics.
      UserPoolId: !Ref CognitoRiderUserPool

  # ============================================================================
  # API GATEWAY HTTP API - TOUR MANAGEMENT APP
  # ============================================================================
  
  TourDataApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      # JWT authentication via Cognito.
      # When CognitoUserPoolArn is empty (default), a User Pool is auto-created.
      # When provided, the existing User Pool is used instead.
      # For local development, sam local start-api bypasses HTTP API authorizers.
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !If
                - CreateCognito
                - !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}'
                - !Sub
                  - 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}'
                  - UserPoolId: !Select [1, !Split ['/', !Select [5, !Split [':', !Ref CognitoUserPoolArn]]]]
              audience:
                - !If [CreateCognito, !Ref CognitoUserPoolClient, !Ref CognitoAppClientId]
      CorsConfiguration:
        AllowOrigins:
          - '*'  # TODO: Restrict to specific domains in production
        AllowHeaders:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        MaxAge: 600
      Tags:
        Name: !Sub '${AWS::StackName}-api'
        Project: tour-data-api
        Environment: !Ref Environment
        Application: TourManagement
        ManagedBy: SAM

  # ============================================================================
  # API GATEWAY HTTP API - RIDER APP (dedicated, authenticated via rider pool)
  # Rider app has its own API Gateway and User Pool for proper isolation.
  # Always created — independent of the management Cognito pool.
  # ============================================================================

  RiderApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: RiderCognitoAuthorizer
        Authorizers:
          RiderCognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoRiderUserPool}'
              audience:
                - !Ref CognitoRiderUserPoolClient
      CorsConfiguration:
        AllowOrigins:
          - '*'  # TODO: Restrict to specific domains in production
        AllowHeaders:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - OPTIONS
        MaxAge: 600
      Tags:
        Name: !Sub '${AWS::StackName}-rider-api'
        Project: tour-data-api
        Environment: !Ref Environment
        Application: TourRiderApp
        ManagedBy: SAM

  # ============================================================================
  # LAMBDA LAYERS
  # ============================================================================
  
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${AWS::StackName}-common-layer'
      Description: Common utilities, models, and dependencies
      ContentUri: src/layers/common/
      CompatibleRuntimes:
        - python3.11
        - python3.12
        - python3.13
        - python3.14
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.14

  # ============================================================================
  # LAMBDA FUNCTIONS - TOURS (Shared Tour table)
  # ============================================================================
  
  GetActiveTourFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/tours/
      Handler: get_active.lambda_handler
      Description: Get the currently active tour
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TourMasterTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub '${TourMasterTable.Arn}/index/*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/active
            Method: GET
        RiderHttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref RiderApi
            Path: /v1/tours/active
            Method: GET

  GetTourFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/tours/
      Handler: get_tour.lambda_handler
      Description: Get tour by ID
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TourMasterTable
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}
            Method: GET
        RiderHttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref RiderApi
            Path: /v1/tours/{tourId}
            Method: GET

  ListToursFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/tours/
      Handler: list_tours.lambda_handler
      Description: List all tours with optional status filter
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TourMasterTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub '${TourMasterTable.Arn}/index/*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours
            Method: GET

  CreateTourFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/tours/
      Handler: create_tour.lambda_handler
      Description: Create and provision a new tour (creates tour-specific DynamoDB tables)
      Timeout: 120
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TourMasterTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:CreateTable
                - dynamodb:DescribeTable
                - dynamodb:TagResource
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours
            Method: POST

  ArchiveTourFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/tours/
      Handler: archive_tour.lambda_handler
      Description: Archive a completed tour (optionally export data, delete tour-specific tables)
      Timeout: 120
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TourMasterTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DeleteTable
                - dynamodb:DescribeTable
                - dynamodb:Scan
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - !Sub '${PhotosBucket.Arn}/archives/*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}/archive
            Method: POST

  # ============================================================================
  # LAMBDA FUNCTIONS - RIDERS
  # ============================================================================
  
  GetRiderProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/riders/
      Handler: get_rider_profile.lambda_handler
      Description: Get rider profile by profile ID
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RiderProfileTable
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/riders/profile/{profileId}
            Method: GET
        RiderHttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref RiderApi
            Path: /v1/riders/profile/{profileId}
            Method: GET

  UpdateRiderProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/riders/
      Handler: update_rider_profile.lambda_handler
      Description: Update rider profile
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RiderProfileTable
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/riders/profile/{profileId}
            Method: PUT
        RiderHttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref RiderApi
            Path: /v1/riders/profile/{profileId}
            Method: PUT

  GetTourRidersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/riders/
      Handler: get_tour_riders.lambda_handler
      Description: Get all riders for a tour with profile data
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RiderProfileTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:BatchGetItem
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}/riders
            Method: GET

  GetTourRiderByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/riders/
      Handler: get_tour_rider.lambda_handler
      Description: Get specific tour rider by Rider ID
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RiderProfileTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}/riders/{riderId}
            Method: GET
        RiderHttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref RiderApi
            Path: /v1/tours/{tourId}/riders/{riderId}
            Method: GET

  GetRiderRideDetailsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/riders/
      Handler: get_rider_ride_details.lambda_handler
      Description: Get rider popup details for a specific ride
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RiderProfileTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}/rides/{rideId}/riders/{riderId}/details
            Method: GET

  CreateRiderProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/riders/
      Handler: create_rider_profile.lambda_handler
      Description: Create a new rider profile during sign-up
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RiderProfileTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub '${RiderProfileTable.Arn}/index/*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/riders/profile
            Method: POST
        RiderHttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref RiderApi
            Path: /v1/riders/profile
            Method: POST

  RegisterTourRiderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/riders/
      Handler: register_tour_rider.lambda_handler
      Description: Register a rider for a tour (rider-initiated)
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TourMasterTable
        - DynamoDBReadPolicy:
            TableName: !Ref RiderProfileTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}/riders
            Method: POST
        RiderHttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref RiderApi
            Path: /v1/tours/{tourId}/riders
            Method: POST

  GetRiderStatisticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/riders/
      Handler: get_rider_statistics.lambda_handler
      Description: Get aggregated statistics for a rider in a tour
      Layers:
        - !Ref CommonLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Scan
                - dynamodb:Query
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}/riders/{riderId}/statistics
            Method: GET
        RiderHttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref RiderApi
            Path: /v1/tours/{tourId}/riders/{riderId}/statistics
            Method: GET

  UploadProfilePictureFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/riders/
      Handler: upload_profile_picture.lambda_handler
      Description: Generate presigned URL for profile picture upload
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RiderProfileTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - !Sub '${PhotosBucket.Arn}/profiles/*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/riders/profile/{profileId}/picture
            Method: POST
        RiderHttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref RiderApi
            Path: /v1/riders/profile/{profileId}/picture
            Method: POST

  # ============================================================================
  # LAMBDA FUNCTIONS - RIDES
  # ============================================================================
  
  GetTodaysRideFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/rides/
      Handler: get_todays_ride.lambda_handler
      Description: Get today's ride for a tour
      Layers:
        - !Ref CommonLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}/rides/today
            Method: GET
        RiderHttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref RiderApi
            Path: /v1/tours/{tourId}/rides/today
            Method: GET

  GetRideFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/rides/
      Handler: get_ride.lambda_handler
      Description: Get ride by ID
      Layers:
        - !Ref CommonLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}/rides/{rideId}
            Method: GET
        RiderHttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref RiderApi
            Path: /v1/tours/{tourId}/rides/{rideId}
            Method: GET

  ListRidesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/rides/
      Handler: list_rides.lambda_handler
      Description: List all rides for a tour
      Layers:
        - !Ref CommonLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
