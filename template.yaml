      Layers:
        - !Ref CommonLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:ListGroups
              Resource:
                - !If
                  - CreateCognito
                  - !GetAtt CognitoUserPool.Arn
                  - !Ref CognitoUserPoolArn
      Events:
        HttpApi:
