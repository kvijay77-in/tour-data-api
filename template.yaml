  PushSenderDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-push-sender-dlq'
      MessageRetentionPeriod: 1209600

  PushSenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/notifications/
      Handler: push_sender.lambda_handler
      Description: Push sender for notification stream inserts
      Layers:
        - !Ref CommonLayer
      Timeout: 60
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RiderPushDeviceTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RiderPushDeviceTable
        - DynamoDBReadPolicy:
            TableName: !Ref MgmtPushDeviceTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MgmtPushDeviceTable
        - DynamoDBReadPolicy:
            TableName: !Ref RiderToursTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt PushSenderDlq.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !If
                  - HasExpoTokenParamRider
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ExpoTokenParamRider}'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/push/expo-token/rider'
                - !If
                  - HasExpoTokenParamMgmt
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ExpoTokenParamMgmt}'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/push/expo-token/mgmt'
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*'
              Condition:
                StringEquals:
                  kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
            - Effect: Allow
              Action:
                - dynamodb:DescribeStream
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
                - dynamodb:ListStreams
              Resource:
                - !GetAtt RiderNotificationTable.StreamArn
                - !GetAtt MgmtNotificationTable.StreamArn
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-Notification-*/stream/*'

  RiderNotificationStreamMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 100
      Enabled: true
      EventSourceArn: !GetAtt RiderNotificationTable.StreamArn
      FunctionName: !GetAtt PushSenderFunction.Arn
      StartingPosition: LATEST
      MaximumRetryAttempts: 3
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt PushSenderDlq.Arn

  MgmtNotificationStreamMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 100
      Enabled: true
      EventSourceArn: !GetAtt MgmtNotificationTable.StreamArn
      FunctionName: !GetAtt PushSenderFunction.Arn
      StartingPosition: LATEST
      MaximumRetryAttempts: 3
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt PushSenderDlq.Arn

  PushSenderErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Push sender function error alarm
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PushSenderFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

