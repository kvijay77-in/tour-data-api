  # ============================================================================
  # DYNAMODB TABLES (Shared - SAM-managed)
  # ============================================================================
  
  RiderProfileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-RiderProfile'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: profileId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: profileId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-RiderProfile'
        - Key: Project
          Value: tour-data-api
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: TourManagement
        - Key: ManagedBy
          Value: SAM

  TourMasterTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-TourMaster'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: tourId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: tourId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-TourMaster'
        - Key: Project
          Value: tour-data-api
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: TourManagement
        - Key: ManagedBy
          Value: SAM

  # ============================================================================
  # Tour-specific tables (TourRider, Ride, CheckIn, User, Notification) are NOT defined here.
  # They are provisioned at runtime by CreateTourFunction when a tour is created.
  # Table naming: {StackName}-{TableType}-{tourId}
  # ============================================================================

  # ============================================================================
  # S3 BUCKET FOR RIDER PHOTOS
  # ============================================================================
  
  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-photos-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: !If [IsProd, Enabled, Suspended]
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-photos'
        - Key: Project
          Value: tour-data-api
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: TourManagement
        - Key: ManagedBy
          Value: SAM

  PhotosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotosBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt PhotosBucket.Arn
              - !Sub '${PhotosBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

# ============================================================================
# OUTPUTS
# ============================================================================

Outputs:
  ApiEndpoint:
    Description: HTTP API endpoint URL
    Value: !Sub 'https://${TourDataApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  ApiId:
    Description: API Gateway HTTP API ID
    Value: !Ref TourDataApi
    Export:
      Name: !Sub '${AWS::StackName}-ApiId'

  RiderProfileTableName:
    Description: Rider Profile DynamoDB table name
    Value: !Ref RiderProfileTable
    Export:
      Name: !Sub '${AWS::StackName}-RiderProfileTable'

  TourMasterTableName:
    Description: TourMaster DynamoDB table name
    Value: !Ref TourMasterTable
    Export:
      Name: !Sub '${AWS::StackName}-TourMasterTable'

  PhotosBucketName:
    Description: S3 bucket for rider photos
    Value: !Ref PhotosBucket
    Export:
      Name: !Sub '${AWS::StackName}-PhotosBucket'

  StackName:
    Description: Stack name for dynamic tour-specific table name resolution
    Value: !Ref AWS::StackName
    Export:
      Name: !Sub '${AWS::StackName}-StackName'

  CognitoUserPoolIdOutput:
    Condition: CreateCognito
    Description: Auto-created Cognito User Pool ID
