    Properties:
      CodeUri: src/functions/hotels/
      Handler: get_upload_status.lambda_handler
      Description: Get hotel allocation upload status
      Layers:
        - !Ref CommonLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
