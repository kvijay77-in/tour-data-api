AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  tour-data-api
  
  Backend API for cycling tour management providing centralized data access
  for Check-In App and future applications.
  
  Table Strategy: Hybrid (Shared + Tour-Specific)
  - Shared tables (SAM-managed): RiderProfile, Tour
  - Tour-specific tables (runtime-provisioned): TourRider-{tourId}, Ride-{tourId},
    CheckIn-{tourId}, User-{tourId}

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W8001  # CreateCognito condition references conditional resources

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: !Ref PythonRuntime
    Architectures:
      - x86_64
    Environment:
      Variables:
        # Shared table names (SAM-managed)
        RIDER_PROFILE_TABLE: !Ref RiderProfileTable
        TOUR_TABLE: !Ref TourTable
        # Dynamic table name resolution
        STACK_NAME: !Ref AWS::StackName
        # Metadata
        SUBSCRIPTION_ID: !Ref SubscriptionId
        ENVIRONMENT: !Ref Environment
        PHOTOS_BUCKET: !Ref PhotosBucket
        LOG_LEVEL: INFO
    Tags:
      Project: tour-data-api
      Environment: !Ref Environment
      Application: TourManagement
      ManagedBy: SAM
      SubscriptionId: !Ref SubscriptionId

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Environment name (dev, test, or prod)

  PythonRuntime:
    Type: String
    Default: python3.14
    AllowedValues:
      - python3.11
      - python3.12
      - python3.13
      - python3.14
    Description: Python runtime version for Lambda functions
  
  CognitoUserPoolArn:
    Type: String
    Description: ARN of an existing Cognito User Pool. Leave empty to auto-create one.
    Default: ''
  
  CognitoAppClientId:
    Type: String
    Description: Existing Cognito App Client ID. Leave empty to auto-create one.
    Default: ''
  
  SubscriptionId:
    Type: String
    Description: Unique identifier for this deployment instance (for tracking and cost attribution)
    Default: ''
  


Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  CreateCognito: !Equals [!Ref CognitoUserPoolArn, '']


Resources:
  # ============================================================================
  # COGNITO USER POOL (auto-created when CognitoUserPoolArn is not provided)
  # ============================================================================

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Condition: CreateCognito
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
      UserPoolTags:
        Project: tour-data-api
        Environment: !Ref Environment
        ManagedBy: SAM

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: CreateCognito
    Properties:
      ClientName: !Sub '${AWS::StackName}-app-client'
      UserPoolId: !Ref CognitoUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false

  # ============================================================================
  # API GATEWAY HTTP API
  # ============================================================================
  
  TourDataApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      # JWT authentication via Cognito.
      # When CognitoUserPoolArn is empty (default), a User Pool is auto-created.
      # When provided, the existing User Pool is used instead.
      # For local development, sam local start-api bypasses HTTP API authorizers.
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !If
                - CreateCognito
                - !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}'
                - !Sub
                  - 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}'
                  - UserPoolId: !Select [1, !Split ['/', !Select [5, !Split [':', !Ref CognitoUserPoolArn]]]]
              audience:
                - !If [CreateCognito, !Ref CognitoUserPoolClient, !Ref CognitoAppClientId]
      CorsConfiguration:
        AllowOrigins:
          - '*'  # TODO: Restrict to specific domains in production
        AllowHeaders:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        MaxAge: 600
      Tags:
        Name: !Sub '${AWS::StackName}-api'
        Project: tour-data-api
        Environment: !Ref Environment
        Application: TourManagement
        ManagedBy: SAM

  # ============================================================================
  # LAMBDA LAYERS
  # ============================================================================
  
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${AWS::StackName}-common-layer'
      Description: Common utilities, models, and dependencies
      ContentUri: src/layers/common/
      CompatibleRuntimes:
        - python3.11
        - python3.12
        - python3.13
        - python3.14
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.14

  # ============================================================================
  # LAMBDA FUNCTIONS - TOURS (Shared Tour table)
  # ============================================================================
  
  GetActiveTourFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/tours/
      Handler: get_active.lambda_handler
      Description: Get the currently active tour
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TourTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub '${TourTable.Arn}/index/*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/active
            Method: GET

  GetTourFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/tours/
      Handler: get_tour.lambda_handler
      Description: Get tour by ID
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TourTable
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}
            Method: GET

  ListToursFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/tours/
      Handler: list_tours.lambda_handler
      Description: List all tours with optional status filter
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TourTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub '${TourTable.Arn}/index/*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours
            Method: GET

  CreateTourFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/tours/
      Handler: create_tour.lambda_handler
      Description: Create and provision a new tour (creates tour-specific DynamoDB tables)
      Timeout: 120
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TourTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:CreateTable
                - dynamodb:DescribeTable
                - dynamodb:TagResource
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours
            Method: POST

  ArchiveTourFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/tours/
      Handler: archive_tour.lambda_handler
      Description: Archive a completed tour (optionally export data, delete tour-specific tables)
      Timeout: 120
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TourTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DeleteTable
                - dynamodb:DescribeTable
                - dynamodb:Scan
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - !Sub '${PhotosBucket.Arn}/archives/*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}/archive
            Method: POST

  # ============================================================================
  # LAMBDA FUNCTIONS - RIDERS
  # ============================================================================
  
  GetRiderProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/riders/
      Handler: get_rider_profile.lambda_handler
      Description: Get rider profile by profile ID
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RiderProfileTable
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/riders/profile/{profileId}
            Method: GET

  UpdateRiderProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/riders/
      Handler: update_rider_profile.lambda_handler
      Description: Update rider profile
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RiderProfileTable
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/riders/profile/{profileId}
            Method: PUT

  GetTourRidersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/riders/
      Handler: get_tour_riders.lambda_handler
      Description: Get all riders for a tour with profile data
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RiderProfileTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:BatchGetItem
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}/riders
            Method: GET

  GetTourRiderByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/riders/
      Handler: get_tour_rider.lambda_handler
      Description: Get specific tour rider by Rider ID
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RiderProfileTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}/riders/{riderId}
            Method: GET

  # ============================================================================
  # LAMBDA FUNCTIONS - RIDES
  # ============================================================================
  
  GetTodaysRideFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/rides/
      Handler: get_todays_ride.lambda_handler
      Description: Get today's ride for a tour
      Layers:
        - !Ref CommonLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}/rides/today
            Method: GET

  GetRideFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/rides/
      Handler: get_ride.lambda_handler
      Description: Get ride by ID
      Layers:
        - !Ref CommonLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}/rides/{rideId}
            Method: GET

  ListRidesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/rides/
      Handler: list_rides.lambda_handler
      Description: List all rides for a tour
      Layers:
        - !Ref CommonLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}/rides
            Method: GET

  CreateRideFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/rides/
      Handler: create_ride.lambda_handler
      Description: Create a new ride for a tour
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TourTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}/rides
            Method: POST

  UpdateRideFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/rides/
      Handler: update_ride.lambda_handler
      Description: Update an existing ride
      Layers:
        - !Ref CommonLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}/rides/{rideId}
            Method: PUT

  CloseRideFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/rides/
      Handler: close_ride.lambda_handler
      Description: Close a ride (lock from further check-ins)
      Layers:
        - !Ref CommonLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}/rides/{rideId}/close
            Method: POST

  # ============================================================================
  # LAMBDA FUNCTIONS - CHECK-INS
  # ============================================================================
  
  CreateCheckInFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/checkins/
      Handler: create_checkin.lambda_handler
      Description: Create a check-in record
      Layers:
        - !Ref CommonLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}/checkins
            Method: POST

  GetRideCheckInsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/checkins/
      Handler: get_ride_checkins.lambda_handler
      Description: Get all check-ins for a ride
      Layers:
        - !Ref CommonLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}/rides/{rideId}/checkins
            Method: GET

  GetDashboardDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/checkins/
      Handler: get_dashboard_data.lambda_handler
      Description: Get complete dashboard data for a ride
      Timeout: 60
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RiderProfileTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:Scan
                - dynamodb:BatchGetItem
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}/rides/{rideId}/dashboard
            Method: GET

  # ============================================================================
  # LAMBDA FUNCTIONS - USERS
  # ============================================================================

  GetCurrentUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/users/
      Handler: get_current_user.lambda_handler
      Description: Get current authenticated user details from JWT token
      Layers:
        - !Ref CommonLayer
      Policies: []
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/users/me
            Method: GET

  ListTourUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/users/
      Handler: list_tour_users.lambda_handler
      Description: List all users/staff for a tour
      Layers:
        - !Ref CommonLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TourDataApi
            Path: /v1/tours/{tourId}/users
            Method: GET

  # ============================================================================
  # DYNAMODB TABLES (Shared - SAM-managed)
  # ============================================================================
  
  RiderProfileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-RiderProfile'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: profileId
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
            - AttributeName: profileId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-RiderProfile'
        - Key: Project
          Value: tour-data-api
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: TourManagement
        - Key: ManagedBy
          Value: SAM

  TourTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-Tour'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-Tour'
        - Key: Project
          Value: tour-data-api
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: TourManagement
        - Key: ManagedBy
          Value: SAM

  # ============================================================================
  # Tour-specific tables (TourRider, Ride, CheckIn, User) are NOT defined here.
  # They are provisioned at runtime by CreateTourFunction when a tour is created.
  # Table naming: {StackName}-{TableType}-{tourId}
  # ============================================================================

  # ============================================================================
  # S3 BUCKET FOR RIDER PHOTOS
  # ============================================================================
  
  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-photos-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: !If [IsProd, Enabled, Suspended]
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-photos'
        - Key: Project
          Value: tour-data-api
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: TourManagement
        - Key: ManagedBy
          Value: SAM

  PhotosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotosBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt PhotosBucket.Arn
              - !Sub '${PhotosBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

# ============================================================================
# OUTPUTS
# ============================================================================

Outputs:
  ApiEndpoint:
    Description: HTTP API endpoint URL
    Value: !Sub 'https://${TourDataApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  ApiId:
    Description: API Gateway HTTP API ID
    Value: !Ref TourDataApi
    Export:
      Name: !Sub '${AWS::StackName}-ApiId'

  RiderProfileTableName:
    Description: Rider Profile DynamoDB table name
    Value: !Ref RiderProfileTable
    Export:
      Name: !Sub '${AWS::StackName}-RiderProfileTable'

  TourTableName:
    Description: Tour DynamoDB table name
    Value: !Ref TourTable
    Export:
      Name: !Sub '${AWS::StackName}-TourTable'

  PhotosBucketName:
    Description: S3 bucket for rider photos
    Value: !Ref PhotosBucket
    Export:
      Name: !Sub '${AWS::StackName}-PhotosBucket'

  StackName:
    Description: Stack name for dynamic tour-specific table name resolution
    Value: !Ref AWS::StackName
    Export:
      Name: !Sub '${AWS::StackName}-StackName'

  CognitoUserPoolIdOutput:
    Condition: CreateCognito
    Description: Auto-created Cognito User Pool ID
    Value: !Ref CognitoUserPool

  CognitoUserPoolArnOutput:
    Condition: CreateCognito
    Description: Auto-created Cognito User Pool ARN
    Value: !GetAtt CognitoUserPool.Arn

  CognitoAppClientIdOutput:
    Condition: CreateCognito
    Description: Auto-created Cognito App Client ID
    Value: !Ref CognitoUserPoolClient
