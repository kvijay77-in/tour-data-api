  # ============================================================================
  # Tour-specific tables (TourRider, Ride, CheckIn, User, Notification, Artifacts, Event,
  # EventOccurrence, EventActivityLogs, Hotel, RoomAllocation) are NOT defined here.
  # They are provisioned at runtime by CreateTourFunction when a tour is created.
  # Table naming: {StackName}-{TableType}-{tourId}
  # ============================================================================

  # ============================================================================
  # S3 BUCKET FOR RIDER PHOTOS
  # ============================================================================

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-artifacts-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: !If [IsProd, Enabled, Suspended]
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-artifacts'
        - Key: Project
          Value: tour-data-api
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: TourManagement
        - Key: ManagedBy
          Value: SAM

  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ArtifactsBucket.Arn
              - !Sub '${ArtifactsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
  
  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-photos-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: !If [IsProd, Enabled, Suspended]
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-photos'
        - Key: Project
          Value: tour-data-api
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: TourManagement
        - Key: ManagedBy
          Value: SAM

  PhotosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotosBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt PhotosBucket.Arn
              - !Sub '${PhotosBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

# ============================================================================
# OUTPUTS
# ============================================================================

Outputs:
  ApiEndpoint:
    Description: HTTP API endpoint URL
    Value: !Sub 'https://${TourDataApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  ApiId:
    Description: API Gateway HTTP API ID
    Value: !Ref TourDataApi
    Export:
      Name: !Sub '${AWS::StackName}-ApiId'

  RiderProfileTableName:
    Description: Rider Profile DynamoDB table name
    Value: !Ref RiderProfileTable
    Export:
      Name: !Sub '${AWS::StackName}-RiderProfileTable'

  RiderCognitoUserTableName:
    Description: Rider Cognito user mapping DynamoDB table name
    Value: !Ref RiderCognitoUserTable
    Export:
      Name: !Sub '${AWS::StackName}-RiderCognitoUserTable'

  RiderToursTableName:
    Description: Rider tour participation DynamoDB table name
    Value: !Ref RiderToursTable
    Export:
      Name: !Sub '${AWS::StackName}-RiderToursTable'

  TourMasterTableName:
    Description: TourMaster DynamoDB table name
    Value: !Ref TourMasterTable
    Export:
      Name: !Sub '${AWS::StackName}-TourMasterTable'

  AppConfigTableName:
    Description: AppConfig DynamoDB table name
    Value: !Ref AppConfigTable
    Export:
      Name: !Sub '${AWS::StackName}-AppConfigTable'

  PhotosBucketName:
    Description: S3 bucket for rider photos
    Value: !Ref PhotosBucket
    Export:
      Name: !Sub '${AWS::StackName}-PhotosBucket'

  ArtifactsBucketName:
    Description: S3 bucket for tour and ride artifacts
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub '${AWS::StackName}-ArtifactsBucket'

  StackName:
    Description: Stack name for dynamic tour-specific table name resolution
    Value: !Ref AWS::StackName
    Export:
      Name: !Sub '${AWS::StackName}-StackName'

  CognitoUserPoolIdOutput:
    Condition: CreateCognito
    Description: Auto-created Cognito User Pool ID
    Value: !Ref CognitoUserPool

  CognitoUserPoolArnOutput:
    Condition: CreateCognito
    Description: Auto-created Cognito User Pool ARN
    Value: !GetAtt CognitoUserPool.Arn

  CognitoAppClientIdOutput:
    Condition: CreateCognito
    Description: Auto-created Cognito App Client ID (tour-mgmt-app)
    Value: !Ref CognitoUserPoolClient

  RiderApiEndpoint:
    Description: Rider App HTTP API endpoint URL
    Value: !Sub 'https://${RiderApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'

  RiderApiId:
    Description: Rider App API Gateway HTTP API ID
    Value: !Ref RiderApi

  CognitoRiderUserPoolIdOutput:
    Description: Cognito User Pool ID (tour-rider-app)
    Value: !Ref CognitoRiderUserPool

  CognitoRiderUserPoolArnOutput:
    Description: Cognito User Pool ARN (tour-rider-app)
    Value: !GetAtt CognitoRiderUserPool.Arn

  CognitoRiderAppClientIdOutput:
    Description: Cognito App Client ID (tour-rider-app)
    Value: !Ref CognitoRiderUserPoolClient
