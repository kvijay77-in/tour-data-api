        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: profileId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: personalCode
          AttributeType: S
      KeySchema:
        - AttributeName: profileId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: PersonalCodeIndex
          KeySchema:
            - AttributeName: personalCode
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-RiderProfile'
        - Key: Project
          Value: tour-data-api
        - Key: Environment
          Value: !Ref Environment
