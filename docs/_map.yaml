# docmaint doc map for the backend (tour-data-api).
# Commit as docs/_map.yaml on the code branch. Check with:
#   docmaint map check backend --file docs/_map.yaml
#
# Resolution: per changed path (or changed SAM logical ID), the most specific
# matching pattern wins. FILE#ID patterns beat path patterns; then more literal
# characters win. So the narrow entries below (dashboards, rider exit, profile,
# admin user management) take their files away from the broad domain entries.
#
# Not mapped on purpose:
#   docs/requirements/**  product intent; code changes don't edit it (see brief)
#   docs/misc/**          historical, never edited
#   tests/test_*.py       test-only changes don't affect docs
version: 1
entries:
  # ---------------------------------------------------------------- tours
  - id: tours-api
    kind: api
    code:
      - "src/functions/tours/**"
      - "template.yaml#GetActiveTourFunction"
      - "template.yaml#GetTourFunction"
      - "template.yaml#ListToursFunction"
      - "template.yaml#CreateTourFunction"
      - "template.yaml#UpdateTourFunction"
    docs:
      - file: docs/design/api-reference.md
        heading: "Tours"
      - file: docs/design/api-reference.md
        heading: "Tours Examples"

  - id: tour-lifecycle
    kind: data-model
    code:
