AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GitHub OIDC identity provider for Tour Data API CI/CD.

  Creates ONLY the identity provider that lets AWS trust tokens issued by GitHub Actions.
  It grants no permissions. Deployment roles are created per environment by
  cloudformation/deploy-access.yaml.

  Deploy this stack at most ONCE per AWS account, and skip it entirely if the account
  already has a provider for token.actions.githubusercontent.com (an account can hold
  only one). Instructions: docs/guides/aws-deploy-access-setup.md

  Usage:
    aws cloudformation deploy \
      --template-file cloudformation/github-oidc.yaml \
      --stack-name tour-data-api-github-oidc \
      --tags Project=tour-data-api ManagedBy=CloudFormation

Resources:
  # Shared across repositories in the account; the trust decision (which repo and branch
  # may assume which role) is made by each deploy role's trust policy, not here.
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
      Tags:
        - Key: Project
          Value: tour-data-api
        - Key: Purpose
          Value: GitHub Actions OIDC Authentication
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  OIDCProviderArn:
    Description: GitHub OIDC Provider ARN (the default OidcProviderArn used by deploy-access.yaml)
    Value: !Ref GitHubOIDCProvider
