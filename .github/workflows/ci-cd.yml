name: CI/CD Pipeline

# Manual runs only. The target environment is derived from the branch the workflow is run on:
#   develop -> dev
#   main    -> prod
# Any other branch is rejected. Test is deployed from a terminal only (see docs/guides/deployment.md).
# AWS access uses OIDC with one least-privilege role per environment; the role's trust policy only
# accepts tokens from its own branch (docs/guides/aws-deploy-access-setup.md).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  PYTHON_VERSION: '3.14'
  SAM_CLI_VERSION: 1.172.1

jobs:
  resolve-env:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      sam_config_env: ${{ steps.resolve.outputs.sam_config_env }}
      role_secret: ${{ steps.resolve.outputs.role_secret }}
    steps:
      - name: Map branch to environment
        id: resolve
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "branch" ]; then
            echo "::error::Run this workflow on the 'develop' (dev) or 'main' (prod) branch, not on a $REF_TYPE."
            exit 1
          fi
          case "$REF_NAME" in
            develop)
              {
                echo "environment=dev"
                echo "sam_config_env=default"
                echo "role_secret=AWS_DEPLOY_ROLE_ARN_DEV"
              } >> "$GITHUB_OUTPUT"
              ;;
            main)
              {
                echo "environment=prod"
                echo "sam_config_env=prod"
                echo "role_secret=AWS_DEPLOY_ROLE_ARN_PROD"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Branch '$REF_NAME' cannot be deployed. Run this workflow on 'develop' (dev) or 'main' (prod)."
              exit 1
              ;;
          esac

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: resolve-env

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r src/layers/common/requirements.txt

      - name: Run linters
        run: |
          pylint src/layers/common/*.py --disable=C0114,C0115,C0116
          black --check src/

      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install SAM CLI
        run: |
          pip install aws-sam-cli==${{ env.SAM_CLI_VERSION }}

      - name: Validate SAM template
        run: |
          sam validate --lint

      - name: Build SAM application
        run: |
          sam build

  deploy:
    name: Deploy to ${{ needs.resolve-env.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [resolve-env, test, build]
    # No overlapping deployments to the same environment.
    concurrency:
      group: deploy-${{ needs.resolve-env.outputs.environment }}
      cancel-in-progress: false
    # Deliberately no `environment:` key: it would change the OIDC `sub` claim that the AWS role trusts.
    permissions:
      id-token: write
      contents: read
    env:
      STACK_NAME: ${{ needs.resolve-env.outputs.environment }}
      SAM_CONFIG_ENV: ${{ needs.resolve-env.outputs.sam_config_env }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS credentials (OIDC, role only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[needs.resolve-env.outputs.role_secret] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install SAM CLI
        run: |
          pip install aws-sam-cli==${{ env.SAM_CLI_VERSION }}

      - name: Build and deploy
        id: deploy
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          sam build
          sam deploy \
            --config-env "$SAM_CONFIG_ENV" \
            --s3-bucket "tour-data-api-sam-${STACK_NAME}-${ACCOUNT_ID}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Seed AppConfig and NotificationRule defaults
        # Insert-only and safe to re-run. The deploy role may only GetItem/PutItem on these two tables.
        run: |
          python scripts/seed_app_config.py --table-name "${STACK_NAME}-AppConfig" --region "$AWS_REGION"
          python scripts/seed_notification_rules.py --table-name "${STACK_NAME}-NotificationRule" --region "$AWS_REGION"

      - name: Show API endpoints
        run: |
          for KEY in ApiEndpoint RiderApiEndpoint; do
            VALUE=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='${KEY}'].OutputValue" --output text)
            echo "${KEY}: ${VALUE}"
            echo "- **${KEY}**: ${VALUE}" >> "$GITHUB_STEP_SUMMARY"
          done
