name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - prod

env:
  SAM_CLI_VERSION: 1.105.0

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r src/layers/common/requirements.txt
      
      - name: Run linters
        run: |
          pylint src/layers/common/*.py --disable=C0114,C0115,C0116
          black --check src/
      
      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install SAM CLI
        run: |
          pip install aws-sam-cli==${{ env.SAM_CLI_VERSION }}
      
      - name: Validate SAM template
        run: |
          sam validate --lint
      
      - name: Build SAM application
        run: |
          sam build

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.environment == 'dev'
    permissions:
      id-token: write
      contents: read
    environment:
      name: development
      url: ${{ steps.deploy.outputs.api_endpoint }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION_DEV }}
      EXPECTED_BACKEND_REGION: ${{ vars.EXPECTED_BACKEND_REGION_DEV }}
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID_DEV }}
      MANAGEMENT_WEB_ENABLED: ${{ vars.MANAGEMENT_WEB_ENABLED_DEV || 'false' }}
      MANAGEMENT_WEB_STACK_NAME: ${{ vars.MANAGEMENT_WEB_STACK_NAME_DEV || 'tour-mgmt-web-dev' }}
      MANAGEMENT_WEB_STACK_REGION: ${{ vars.MANAGEMENT_WEB_STACK_REGION_DEV || vars.AWS_REGION_DEV }}
      MANAGEMENT_WEB_ADDITIONAL_ORIGINS: ${{ vars.MANAGEMENT_WEB_ADDITIONAL_ORIGINS_DEV }}
      MANAGEMENT_WEB_PROJECT_TAG: ${{ vars.MANAGEMENT_WEB_PROJECT_TAG || 'tour-mgmt-app' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validate deployment target configuration
        run: |
          test -n "$AWS_REGION" || { echo "AWS_REGION_DEV must be configured"; exit 1; }
          test -n "$EXPECTED_BACKEND_REGION" || { echo "EXPECTED_BACKEND_REGION_DEV must be configured"; exit 1; }
          test -n "$EXPECTED_AWS_ACCOUNT_ID" || { echo "AWS_ACCOUNT_ID_DEV must be configured"; exit 1; }
          test "$AWS_REGION" = "$EXPECTED_BACKEND_REGION" || { echo "Backend region configuration mismatch"; exit 1; }
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install SAM CLI
        run: |
          pip install aws-sam-cli==${{ env.SAM_CLI_VERSION }}
      
      - name: Build and Deploy
        id: deploy
        run: |
          sam build
          python scripts/deploy_backend.py --config-env default --no-confirm-changeset --no-fail-on-empty-changeset
          API_ENDPOINT=$(aws cloudformation describe-stacks --stack-name dev --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" --output text)
          echo "api_endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT
      
      - name: Run smoke tests
        run: |
          # Add smoke tests here
          echo "Running smoke tests..."

  deploy-test:
    name: Deploy to Test
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.environment == 'test'
    permissions:
      id-token: write
      contents: read
    environment:
      name: test
      url: ${{ steps.deploy.outputs.api_endpoint }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION_TEST }}
      EXPECTED_BACKEND_REGION: ${{ vars.EXPECTED_BACKEND_REGION_TEST }}
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID_TEST }}
      MANAGEMENT_WEB_ENABLED: ${{ vars.MANAGEMENT_WEB_ENABLED_TEST || 'false' }}
      MANAGEMENT_WEB_STACK_NAME: ${{ vars.MANAGEMENT_WEB_STACK_NAME_TEST || 'tour-mgmt-web-test' }}
      MANAGEMENT_WEB_STACK_REGION: ${{ vars.MANAGEMENT_WEB_STACK_REGION_TEST || vars.AWS_REGION_TEST }}
      MANAGEMENT_WEB_ADDITIONAL_ORIGINS: ${{ vars.MANAGEMENT_WEB_ADDITIONAL_ORIGINS_TEST }}
      MANAGEMENT_WEB_PROJECT_TAG: ${{ vars.MANAGEMENT_WEB_PROJECT_TAG || 'tour-mgmt-app' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validate deployment target configuration
        run: |
          test -n "$AWS_REGION" || { echo "AWS_REGION_TEST must be configured"; exit 1; }
          test -n "$EXPECTED_BACKEND_REGION" || { echo "EXPECTED_BACKEND_REGION_TEST must be configured"; exit 1; }
          test -n "$EXPECTED_AWS_ACCOUNT_ID" || { echo "AWS_ACCOUNT_ID_TEST must be configured"; exit 1; }
          test "$AWS_REGION" = "$EXPECTED_BACKEND_REGION" || { echo "Backend region configuration mismatch"; exit 1; }
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install SAM CLI
        run: |
          pip install aws-sam-cli==${{ env.SAM_CLI_VERSION }}
      
      - name: Build and Deploy
        id: deploy
        run: |
          sam build
          python scripts/deploy_backend.py --config-env test --no-confirm-changeset --no-fail-on-empty-changeset
          API_ENDPOINT=$(aws cloudformation describe-stacks --stack-name test --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" --output text)
          echo "api_endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT
      
      - name: Run integration tests
        run: |
          # Add integration tests here
          echo "Running integration tests..."

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.environment == 'prod'
    permissions:
      id-token: write
      contents: read
    environment:
      name: production
      url: ${{ steps.deploy.outputs.api_endpoint }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION_PROD }}
      EXPECTED_BACKEND_REGION: ${{ vars.EXPECTED_BACKEND_REGION_PROD }}
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID_PROD }}
      MANAGEMENT_WEB_ENABLED: ${{ vars.MANAGEMENT_WEB_ENABLED_PROD || 'false' }}
      MANAGEMENT_WEB_STACK_NAME: ${{ vars.MANAGEMENT_WEB_STACK_NAME_PROD || 'tour-mgmt-web-prod' }}
      MANAGEMENT_WEB_STACK_REGION: ${{ vars.MANAGEMENT_WEB_STACK_REGION_PROD || vars.AWS_REGION_PROD }}
      MANAGEMENT_WEB_ADDITIONAL_ORIGINS: ${{ vars.MANAGEMENT_WEB_ADDITIONAL_ORIGINS_PROD }}
      MANAGEMENT_WEB_PROJECT_TAG: ${{ vars.MANAGEMENT_WEB_PROJECT_TAG || 'tour-mgmt-app' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validate deployment target configuration
        run: |
          test -n "$AWS_REGION" || { echo "AWS_REGION_PROD must be configured"; exit 1; }
          test -n "$EXPECTED_BACKEND_REGION" || { echo "EXPECTED_BACKEND_REGION_PROD must be configured"; exit 1; }
          test -n "$EXPECTED_AWS_ACCOUNT_ID" || { echo "AWS_ACCOUNT_ID_PROD must be configured"; exit 1; }
          test "$AWS_REGION" = "$EXPECTED_BACKEND_REGION" || { echo "Backend region configuration mismatch"; exit 1; }
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PROD || secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install SAM CLI
        run: |
          pip install aws-sam-cli==${{ env.SAM_CLI_VERSION }}
      
      - name: Build and Deploy
        id: deploy
        run: |
          sam build
          python scripts/deploy_backend.py --config-env prod --no-confirm-changeset --no-fail-on-empty-changeset
          API_ENDPOINT=$(aws cloudformation describe-stacks --stack-name prod --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" --output text)
          echo "api_endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT
      
      - name: Run smoke tests
        run: |
          # Add smoke tests here
          echo "Running smoke tests..."
