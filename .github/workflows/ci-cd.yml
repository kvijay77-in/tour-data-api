name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  AWS_REGION: us-east-1
  SAM_CLI_VERSION: 1.105.0

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r src/layers/common/requirements.txt
      
      - name: Run linters
        run: |
          pylint src/layers/common/python/*.py --disable=C0114,C0115,C0116
          black --check src/
      
      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install SAM CLI
        run: |
          pip install aws-sam-cli==${{ env.SAM_CLI_VERSION }}
      
      - name: Validate SAM template
        run: |
          sam validate --lint
      
      - name: Build SAM application
        run: |
          sam build

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: development
      url: ${{ steps.deploy.outputs.api_endpoint }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install SAM CLI
        run: |
          pip install aws-sam-cli==${{ env.SAM_CLI_VERSION }}
      
      - name: Build and Deploy
        id: deploy
        run: |
          sam build
          sam deploy --config-env default --no-confirm-changeset --no-fail-on-empty-changeset
          API_ENDPOINT=$(aws cloudformation describe-stacks --stack-name tour-data-api --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" --output text)
          echo "api_endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT
      
      - name: Run smoke tests
        run: |
          # Add smoke tests here
          echo "Running smoke tests..."

  deploy-test:
    name: Deploy to Test
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: test
      url: ${{ steps.deploy.outputs.api_endpoint }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install SAM CLI
        run: |
          pip install aws-sam-cli==${{ env.SAM_CLI_VERSION }}
      
      - name: Build and Deploy
        id: deploy
        run: |
          sam build
          sam deploy --config-env test --no-confirm-changeset --no-fail-on-empty-changeset
          API_ENDPOINT=$(aws cloudformation describe-stacks --stack-name tour-data-api-test --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" --output text)
          echo "api_endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT
      
      - name: Run integration tests
        run: |
          # Add integration tests here
          echo "Running integration tests..."

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.api_endpoint }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install SAM CLI
        run: |
          pip install aws-sam-cli==${{ env.SAM_CLI_VERSION }}
      
      - name: Build and Deploy
        id: deploy
        run: |
          sam build
          sam deploy --config-env prod --no-confirm-changeset --no-fail-on-empty-changeset
          API_ENDPOINT=$(aws cloudformation describe-stacks --stack-name tour-data-api-prod --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" --output text)
          echo "api_endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT
      
      - name: Run smoke tests
        run: |
          # Add smoke tests here
          echo "Running smoke tests..."
